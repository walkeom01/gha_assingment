name: Conditional Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        default: staging

env:
  APP_NAME: demo-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.environment == production }}
    steps:
      - name: Print target
        run: echo "Deploying $APP_NAME to ${{ inputs.environment }}"

      - name: Simulated prod deploy
        if: ${{ inputs.environment == 'production' }}
        run: echo "SIMULATED PROD DEPLOY"


      - name: Guarded step
        if: ${{ env.APP_NAME == 'demo-app' }}
        run: echo "guard passed"

      - name: Notify
        if: ${{ always() }}
        run: echo "finished"
